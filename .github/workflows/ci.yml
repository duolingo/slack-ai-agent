name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy example configs
        # Runtime and tests read config/*.yaml, which are gitignored (see README).
        run: |
          cp config/example-emojis.yaml config/emojis.yaml
          cp config/example-channels.yaml config/channels.yaml
          cp config/example-tool-allowlist.yaml config/tool-allowlist.yaml
          cp config/example-tool-denylist.yaml config/tool-denylist.yaml
          cp config/instructions/example-general-context.txt config/instructions/general-context.txt

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
